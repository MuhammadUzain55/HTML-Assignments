<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
        integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header id="navbar">
        <div class="logo-img">
            <img class="border" src="images/amazon_logo.png" alt="logo image">
        </div>

        <div class="delivery-location">
            <i class="ri-map-pin-line"></i>
            <div class="country-name">
                <p>Delivery to<span>Pakistan</span></p>
            </div>
        </div>

        <div class="search-section">
            <div class="drop-down">
                <select name="departments" id="department">
                    <option value="all-departments">All</option>
                    <option value="Arts&crafts">Arts & Crafts</option>
                    <option value="automotive">Automotive</option>
                    <option value="Baby">Baby</option>
                    <option value="Beauty & Personal Care">Beauty & Personal Care</option>
                </select>
            </div>

            <div class="search-input">
                <input type="search" name="search" id="search" placeholder="Search Amazon">
            </div>

            <div class="search-icon">
                <i class="ri-search-line"></i>
            </div>
        </div>

        <div class="language-selection">
            <div>
                <img src="" alt="">
                <p>EN</p>
            </div>

            <div class="account-page">
                <p>Hello, sign in <span>Account & Lists</span></p>
            </div>

            <div class="returns-orders">
                <p>Returns <span>& Orders</span></p>
            </div>

            <div class="cart">
                <i class="fa-solid fa-cart-arrow-down"></i>
                <p>Cart </p>
            </div>
        </div>
    </header>
</body>

</html>
