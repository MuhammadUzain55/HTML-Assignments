<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="../E-Commerce-page-assignment_05/images/IMG4.jpg" alt="Back to Home button image" width="40">
        </a>
    </header>

    <main>
        <div style="text-align: center;">
            <img src="images/smit-logo.jpg" alt="Smit logo image" width="200">
            <h1>Student Login Form</h1>
        </div>

        <div>
            <form action="">
                <table align="center" cellpadding="10">
                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td><input type="email" name="email" id="email" placeholder="Enter your email"></td>
                    </tr>

                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td><input type="text" name="password" id="password" placeholder="enter your password"></td>
                    </tr>

                    <tr>
                        <td align="center" colspan="2">
                            <input type="submit" value="Submit">
                            <input type="reset" value="Reset">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </main>
</body>
</html>
