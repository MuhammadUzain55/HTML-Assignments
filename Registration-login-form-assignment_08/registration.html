<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="../E-Commerce-page-assignment_05/images/IMG4.jpg" alt="Back to Home button image" width="40">
        </a>
    </header>

    <main>
        <div style="text-align: center;">
            <img src="images/smit-logo.jpg" alt="Smit logo image" width="200">
            <h1>Students Registration Form</h1>
        </div>

        <div>
            <form action="">
                <table align="center" cellpadding="10">
                    <tr>
                       <td><label for="first-name">First Name: </label></td>
                       <td><input type="text" name="first-name" id="first-name" placeholder="Enter your first name" required></td>
                    </tr>

                    <tr>
                       <td><label for="last-name">Last Name: </label></td>
                       <td><input type="text" name="last-name" id="last-name" placeholder="Enter your last name" required></td>
                    </tr>

                    <tr>
                       <td><label for="birth-date">Date of Birth: </label></td>
                       <td><input type="date" name="birth-date" id="birth-date" placeholder="Enter your last name" required></td>
                    </tr>
                </table>
            </form>
        </div>
    </main>
</body>
</html>
