<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="../E-Commerce-page-assignment_05/images/IMG4.jpg" alt="Back to Home button image" width="40">
        </a>
    </header>

    <main>
        <div style="text-align: center;">
            <img src="images/smit-logo.jpg" alt="Smit logo image" width="200">
            <h1>Students Registration Form</h1>
        </div>

        <div>
            <form action="">
                <table align="center" cellpadding="10">
                    <tr>
                       <td><label for="first-name">First Name: </label></td>
                       <td><input type="text" name="first-name" id="first-name" placeholder="Enter your first name" required> (max 30 characters a-z and A-Z)</td>
                    </tr>

                    <tr>
                       <td><label for="last-name">Last Name: </label></td>
                       <td><input type="text" name="last-name" id="last-name" placeholder="Enter your last name" required>(max 30 characters a-z and A-Z)</td>
                    </tr>

                    <tr>
                       <td><label for="email">Email ID: </label></td>
                       <td><input type="email" name="email" id="email" placeholder="Enter your email" required></td>
                    </tr>

                    <tr>
                       <td><label for="phone-number">Phone Number: </label></td>
                       <td><input type="number" name="phone-number" id="phone-number" placeholder="Enter Phone number" required> (10 Digits Number)</td>
                    </tr>

                    <tr>
                       <td><label for="birth-date">Date of Birth: </label></td>
                       <td><input type="date" name="birth-date" id="birth-date"></td>
                    </tr>

                    <tr>
                       <td><label for="gender">Gender: </label></td>
                       <td>
                        Male<input type="radio" name="gender" id="gender" value="m" checked>
                        Female<input type="radio" name="gender" id="gender" value="f">
                       </td>
                    </tr>

                    <tr>
                        <td><label for="address">Address: </label></td>
                        <td><textarea name="address" id="address" cols="30" rows="5"></textarea></td>
                    </tr>

                    <tr>
                       <td><label for="city-name">City: </label></td>
                       <td><input type="text" name="city-name" id="city-name" placeholder="Enter your city name" required> (max 30 characters a-z and A-Z)</td>
                    </tr>

                    <tr>
                       <td><label for="postal-code">Postal Code: </label></td>
                       <td><input type="number" name="postal-code" id="postal-code" placeholder="Postal code" required> (6 Digits Numbers)</td>
                    </tr>

                    <tr>
                       <td><label for="state">State: </label></td>
                       <td><input type="text" name="state" id="state" placeholder="Enter the state" required> (max 30 characters a-z and A-Z)</td>
                    </tr>

                    <tr>
                       <td><label for="country-name">Country: </label></td>
                       <td><input type="text" name="country-name" id="country-name" placeholder="Enter the country name" required></td>
                    </tr>

                    <tr>
                        <td>Hobbies</td>
                        <td>
                            <label for="drawing">Drawing</label>
                            <input type="checkbox" name="drawing" id="drawing">

                            <label for="singing">Singing</label>
                            <input type="checkbox" name="singing" id="singing">

                            <label for="dancing">Dancing</label>
                            <input type="checkbox" name="dancing" id="dancing">

                            <label for="sketching">Sketching</label>
                            <input type="checkbox" name="sketching" id="sketching">
                            <br>
                            <label for="other">Others</label>
                            <input type="checkbox" name="other" id="other">
                            <input type="text" name="specify" id="specify" placeholder="Please spicify">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </main>
</body>
</html>
